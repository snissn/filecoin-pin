name: C0 construction cleanup

on:
  push:
    branches:
      - gpt56/issue-36-services-read-cli
    paths:
      - .github/workflows/c0-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-36-services-read-cli
          fetch-depth: 0

      - name: Remove temporary construction files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/gpt56-source-export.yml \
            .github/workflows/c0-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove C0 construction workflows"
          git push origin HEAD:gpt56/issue-36-services-read-cli
